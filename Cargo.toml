[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/lucerna-desktop/lucernad"
homepage = "https://github.com/lucerna-desktop/lucernad"
authors = ["Eduardo Alves"]
publish = false

[workspace.dependencies]
lucerna-service = { git = "https://github.com/lucerna-desktop/lucerna-sdk", rev = "f55ba66dc18b62fab075b20691ad9edb7ca22a1c" }
lucerna-cli = { git = "https://github.com/lucerna-desktop/lucerna-sdk", rev = "f55ba66dc18b62fab075b20691ad9edb7ca22a1c" }
lucerna-ipc = { git = "https://github.com/lucerna-desktop/lucerna-sdk", rev = "f55ba66dc18b62fab075b20691ad9edb7ca22a1c" }
lucerna-manifest = { git = "https://github.com/lucerna-desktop/lucerna-sdk", rev = "f55ba66dc18b62fab075b20691ad9edb7ca22a1c" }
lucerna-paths = { git = "https://github.com/lucerna-desktop/lucerna-sdk", rev = "f55ba66dc18b62fab075b20691ad9edb7ca22a1c" }
lucernad-core = { path = "crates/lucernad-core" }
lucernad-system = { path = "crates/lucernad-system" }
lucernad-spectrum = { path = "crates/lucernad-spectrum" }
lucernad-clipboard = { path = "crates/lucernad-clipboard" }
lucernad-power = { path = "crates/lucernad-power" }
lucernad-web = { path = "crates/lucernad-web" }
lucernad-hyprland = { path = "crates/lucernad-hyprland" }
lucernad-game = { path = "crates/lucernad-game" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rustix = { version = "1", features = ["fs", "event", "net"] }
i2cdev = "0.6"
nvml-wrapper = "0.13"
tempfile = "3"
pipewire = "0.10"
rustfft = "6"
unicode-normalization = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
