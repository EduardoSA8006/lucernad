[package]
name = "lucernad-hyprland"
description = "Módulo hyprland do lucernad: os pedidos e os eventos do socket do Hyprland (o mínimo do modo jogo)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Os dublês (o Hyprland falso, em memória e por socket), para os testes.
testing = []

[dependencies]
lucerna-service.workspace = true
lucernad-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
lucerna-ipc.workspace = true
tempfile.workspace = true
# Os testes deste crate usam o módulo `testing`.
lucernad-hyprland = { path = ".", features = ["testing"] }

[lints]
workspace = true
