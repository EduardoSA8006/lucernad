[package]
name = "lucernad"
description = "O daemon do Lucerna: um binário com um módulo por área (system, spectrum, clipboard, power, web e hyprland)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["system", "spectrum", "clipboard", "power", "web", "hyprland"]
# O módulo `system`: CPU, memória, rede, temperatura, discos e GPUs.
system = ["dep:lucernad-system", "dep:lucernad-core"]
# O módulo `spectrum`: o espectro do som do player exibido, pelo PipeWire.
spectrum = ["dep:lucernad-spectrum", "dep:lucernad-core", "dep:serde_json"]
# O módulo da área de transferência: o histórico do Wayland.
clipboard = ["dep:lucernad-clipboard", "dep:lucernad-core", "dep:serde_json"]
# O módulo power: o brilho das telas, o histórico de consumo e os perfis.
power = ["dep:lucernad-power", "dep:lucernad-core", "dep:serde_json"]
# O módulo web: a letra das músicas e a previsão do tempo.
web = ["dep:lucernad-web", "dep:lucernad-core", "dep:serde_json"]
# O módulo hyprland: o socket do compositor (o mínimo do modo jogo).
hyprland = ["dep:lucernad-hyprland", "dep:lucernad-core", "dep:serde_json"]

[lib]
name = "lucernad"
path = "src/lib.rs"

[[bin]]
name = "lucernad"
path = "src/main.rs"

# Do SDK, só o lucerna-service e o lucerna-cli: eles reexportam o que o daemon usa.
[dependencies]
lucerna-cli.workspace = true
lucerna-service.workspace = true
lucernad-core = { workspace = true, optional = true }
lucernad-clipboard = { workspace = true, optional = true }
lucernad-power = { workspace = true, optional = true }
lucernad-spectrum = { workspace = true, optional = true }
lucernad-system = { workspace = true, optional = true }
lucernad-web = { workspace = true, optional = true }
lucernad-hyprland = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio.workspace = true

[dev-dependencies]
lucernad-clipboard = { workspace = true, features = ["testing"] }
lucernad-power = { workspace = true, features = ["testing"] }
lucernad-spectrum = { workspace = true, features = ["testing"] }
lucernad-system = { workspace = true, features = ["testing"] }
lucernad-web = { workspace = true, features = ["testing"] }
lucernad-hyprland = { workspace = true, features = ["testing"] }
lucerna-ipc.workspace = true
lucerna-manifest.workspace = true
tempfile.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
