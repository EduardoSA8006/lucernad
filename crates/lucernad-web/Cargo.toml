[package]
name = "lucernad-web"
description = "Módulo web do lucernad: a letra das músicas e a previsão do tempo, com cache em disco."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Os dublês e os dados de teste, para os testes.
testing = []

[dependencies]
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
unicode-normalization.workspace = true

[dev-dependencies]
# Os testes deste crate usam o módulo `testing`.
lucernad-web = { path = ".", features = ["testing"] }

[lints]
workspace = true
